[package]
name = "giddy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dns-lookup = "4.0.2"
flate2 = "1.1.10"
futures-util = "0.3.34"
if-addrs = "0.15.0"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"
