[package]
name = "giddy"
version = "0.4.0"
edition = "2024"
description = "Terminal UI that discovers devices on your local network without elevated privileges"
license = "MIT"
repository = "https://github.com/mikemadden42/giddy"
readme = "README.md"
keywords = ["network", "discovery", "mdns", "tui", "lan"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dns-lookup = "4.0.2"
flate2 = "1.1.10"
futures-util = "0.3.34"
if-addrs = "0.15.0"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"

[lints.clippy]
# Enforced in CI (warnings are errors there). Priority -1 lets individual
# lints be overridden below the group if ever needed.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# The duplicates come from inside ratatui/crossterm (hashbrown, syn 2 vs 3)
# or from ratatui's optional termwiz backend, which is never built. Nothing
# giddy can change, and dependency updates would break CI at random.
multiple_crate_versions = "allow"
